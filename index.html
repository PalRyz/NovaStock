<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101713"><title>Stick Kingdom: Legacy of Realms</title><style>
:root{--bg:#101713;--panel:#1a241e;--panel2:#222f27;--line:#35463a;--gold:#f2c15d;--mint:#83d6a2;--red:#ef7869;--cream:#f4f0df;--muted:#a6b4a4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cream);font:14px system-ui,Segoe UI,sans-serif;overflow:hidden}button{font:700 12px system-ui;color:var(--cream);background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;cursor:pointer;touch-action:manipulation;transition:.12s}button:hover,button:active{border-color:var(--gold);transform:translateY(-1px)}button.primary{background:#9d6b2c;border-color:#dfaa4e;color:#fff4d8}button:disabled{opacity:.4;cursor:not-allowed;transform:none}.app{height:100dvh;display:flex;flex-direction:column}.top{height:54px;padding:7px 14px;display:flex;gap:14px;align-items:center;border-bottom:1px solid var(--line);background:#141d17;z-index:2}.brand{font-weight:950;letter-spacing:1px;color:var(--gold);font-size:16px}.brand small{display:block;font-size:8px;color:var(--muted);letter-spacing:3px}.resources{margin-left:auto;display:flex;gap:12px;font-weight:800}.resource{color:var(--gold)}.resource.gem{color:#8ce4de}.main{flex:1;min-height:0;display:grid;grid-template-columns:215px 1fr}.nav{overflow:auto;padding:12px;background:#141d17;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px}.nav button{text-align:left;background:transparent;border-color:transparent;color:#d4dfd1}.nav button.active{background:#27352b;border-color:#415b45;color:var(--gold)}.nav .section{font-size:9px;color:#829182;letter-spacing:2px;padding:12px 8px 3px}.content{position:relative;overflow:auto;padding:18px;background:radial-gradient(ellipse at 50% 0,#26372a 0,transparent 65%)}.view{max-width:1100px;margin:auto}.headline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.headline h1{font-size:24px;margin:0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px}.card{background:linear-gradient(145deg,#202d24,#19221c);border:1px solid var(--line);border-radius:13px;padding:14px;box-shadow:0 8px 24px #0002}.card h3{margin:0 0 8px;color:var(--gold)}.card p{color:var(--muted);line-height:1.5;margin:6px 0 12px}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.stat{font-size:12px;color:#c7d1c4}.hero{min-height:340px;display:grid;place-items:center;text-align:center;position:relative;overflow:hidden;border:1px solid #485b43;border-radius:18px;background:linear-gradient(#17251dcc,#17251ddd),radial-gradient(ellipse at bottom,#647a42,#263928 55%,#101713)}.hero h1{font-size:clamp(30px,6vw,64px);line-height:1;margin:8px;color:var(--gold);text-shadow:0 6px 0 #6d4521}.hero p{max-width:520px;color:#ced7c5}.hero .big{font-size:54px;filter:drop-shadow(0 8px 4px #0008)}.hero .cta{font-size:17px;padding:15px 36px}.bottom{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}.bar{height:8px;background:#101611;border-radius:8px;overflow:hidden}.bar i{height:100%;display:block;background:var(--mint)}.unit{font-size:42px;text-align:center;padding:8px}.badge{border:1px solid #53624d;color:#d9e4d1;border-radius:20px;padding:3px 8px;font-size:10px}.canvasbox{position:relative;height:min(54vh,440px);min-height:260px;border:1px solid #58664d;border-radius:13px;overflow:hidden;background:#192a23}.canvasbox canvas{display:block;width:100%;height:100%;touch-action:none}.battleui{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.battleui button{flex:1;min-width:65px}.overlay{position:fixed;inset:0;background:#071009d9;display:grid;place-items:center;z-index:10;padding:18px}.modal{width:min(560px,100%);max-height:90dvh;overflow:auto;background:#1b281f;border:1px solid #657653;border-radius:17px;padding:20px;box-shadow:0 20px 80px #000b}.modal h2{color:var(--gold)}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#f2c15d;color:#20190c;padding:10px 18px;border-radius:30px;font-weight:800;z-index:30;animation:fade 2.8s both}@keyframes fade{0%,70%{opacity:1}100%{opacity:0}}.node{width:46px;height:46px;border-radius:50%;padding:0}.map{display:flex;flex-wrap:wrap;gap:12px;padding:16px;background:linear-gradient(130deg,#24382b,#30472e);border-radius:14px}.portrait{display:none}.fine{font-size:11px;color:var(--muted)}@media(max-width:720px){.main{grid-template-columns:66px 1fr}.nav{padding:8px 5px}.nav button{font-size:0;text-align:center;padding:11px 3px}.nav button:before{content:attr(data-icon);font-size:19px}.nav .section{font-size:0;padding:5px}.content{padding:12px}.top{height:48px}.brand{font-size:12px}.resources{gap:7px;font-size:12px}.headline h1{font-size:21px}.grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}}@media(orientation:portrait){.portrait{display:flex;position:fixed;inset:0;background:#0c130e;z-index:50;align-items:center;justify-content:center;text-align:center;padding:30px;flex-direction:column}.portrait h2{color:var(--gold);font-size:26px}.portrait p{color:var(--muted)}}
</style></head><body><div class="app"><header class="top"><div class="brand">STICK KINGDOM <small>LEGACY OF REALMS</small></div><div class="resources"><span class="resource">◆ <b id="gold">0</b></span><span class="resource gem">✦ <b id="gems">0</b></span><span>⚑ <b id="tokens">0</b></span></div><button onclick="show('settings')">⚙</button></header><div class="main"><nav class="nav" id="nav"></nav><main class="content" id="content"></main></div></div><div id="modal"></div><div class="portrait"><h2>PUTAR PERANGKAT</h2><p>Game ini dirancang untuk dimainkan dalam mode landscape.</p><button onclick="this.parentNode.remove()">CONTINUE ANYWAY</button></div>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s), names=['Warrior','Spearman','Archer','Mage','Assassin','Knight','Giant','Titan'], icons=['⚔️','🛡️','🏹','🔮','🗡️','♞','👹','👑'], costs=[80,120,150,210,180,260,420,700], stats=[[90,13,1.8,1],[140,16,1.5,1],[70,19,2.4,5],[75,27,2,4],[58,24,2.8,1],[200,25,1.35,1],[390,45,.95,1],[700,78,.85,2]];
const fresh=()=>({name:'Commander',level:1,xp:0,gold:700,gems:12,tokens:0,battles:0,wins:0,losses:0,kills:0,totalGold:0,highestWave:0,campaign:0,stars:{},units:Array(8).fill(1),unitXp:Array(8).fill(0),owned:[0,1,2],equip:[],upgrades:{},skins:['Classic'],achievements:[],quests:{wins:0,kills:0,gold:0,claimed:[]},daily:0,day:0,settings:{music:true,sfx:true,vibration:false,damage:true,language:'English'},bestScore:0});let S;try{S=Object.assign(fresh(),JSON.parse(localStorage.skSave||'{}'))}catch{S=fresh()}let page='home',battle=null,raf=0;function save(){localStorage.skSave=JSON.stringify(S);resources()}function resources(){$('#gold').textContent=Math.floor(S.gold);$('#gems').textContent=S.gems;$('#tokens').textContent=S.tokens}function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2800)}const items=[['HOME','⌂'],['CAMPAIGN','⚑'],['SURVIVAL','∞'],['TOURNAMENT','♜'],['CHALLENGE','✦'],['SHOP','▣'],['ARMY','⚔'],['UPGRADES','⬆'],['QUESTS','☷'],['COLLECTION','◈'],['ACHIEVEMENTS','★'],['PROFILE','♙'],['SETTINGS','⚙']];function nav(){let h='<div class="section">KINGDOM</div>';items.forEach(([n,i])=>h+=`<button data-icon="${i}" class="${page===n.toLowerCase()?'active':''}" onclick="show('${n.toLowerCase()}')">${i} &nbsp; ${n}</button>`);h+='<div class="section">PLAYER</div><div class="fine" style="padding:8px">LV '+S.level+' · '+S.xp+'/'+(S.level*100)+' EXP</div><div class="bar"><i style="width:'+Math.min(100,S.xp/(S.level*100)*100)+'%"></i></div>';$('#nav').innerHTML=h}function show(p){page=p;nav();render()}window.show=show;
const header=(title,sub='')=>`<div class="headline"><div><h1>${title}</h1><div class="muted">${sub}</div></div></div>`;function render(){resources();let c=$('#content');if(page==='home')c.innerHTML=home();else if(page==='campaign')c.innerHTML=campaign();else if(page==='survival')c.innerHTML=mode('SURVIVAL','Defend your realm against endless waves. Every fifth wave brings a boss.', 'survival');else if(page==='tournament')c.innerHTML=tournament();else if(page==='challenge')c.innerHTML=challenge();else if(page==='shop')c.innerHTML=shop();else if(page==='army')c.innerHTML=army();else if(page==='upgrades')c.innerHTML=upgrades();else if(page==='quests')c.innerHTML=quests();else if(page==='collection')c.innerHTML=collection();else if(page==='achievements')c.innerHTML=achievements();else if(page==='profile')c.innerHTML=profile();else if(page==='settings')c.innerHTML=settings();else if(page==='battle')c.innerHTML=battleView();}
function home(){return `<div class="hero"><div><div class="big">⚔️　🏰　🛡️</div><h1>STICK KINGDOM</h1><div style="color:var(--gold);letter-spacing:4px">LEGACY OF REALMS</div><p>Lead your people. Forge alliances. Take the battlefield and shape a legacy that will outlive every realm.</p><button class="primary cta" onclick="show('campaign')">▶ &nbsp; PLAY CAMPAIGN</button></div></div><div class="bottom"><button onclick="show('survival')">∞ SURVIVAL</button><button onclick="show('shop')">▣ SHOP</button><button onclick="show('army')">⚔ ARMY</button><button onclick="show('tournament')">♜ TOURNAMENT</button></div><div class="grid" style="margin-top:16px"><div class="card"><h3>DAILY GIFT</h3><p>Claim your daily reward and keep your kingdom growing.</p><button class="primary" onclick="claimDaily()">CLAIM REWARD</button></div><div class="card"><h3>YOUR LEGACY</h3><p>Level ${S.level} Commander · ${S.wins} victories · ${S.kills} enemies defeated</p><button onclick="show('profile')">VIEW PROFILE →</button></div><div class="card"><h3>DAILY QUESTS</h3><p>Complete objectives for gold, gems and battle tokens.</p><button onclick="show('quests')">VIEW QUESTS →</button></div></div>`}const regions=['Green Valley','Desert Kingdom','Frozen Lands','Dark Forest','Volcano Realm','Ancient Ruins','Sky Fortress','Shadow Kingdom'];function campaign(){let lv=S.campaign;return header('WORLD MAP','Eight realms. Thirty battles. One legacy.')+`<div class="map"><div style="width:100%;font-weight:900;color:var(--gold)">🌿 ${regions[Math.min(7,Math.floor(lv/4))]}</div>${Array.from({length:30},(_,i)=>`<button class="node ${i<=lv?'primary':''}" ${i>lv?'disabled':''} onclick="startBattle('campaign',${i})">${i+1}${S.stars[i]?'★'.repeat(S.stars[i]):''}</button>`).join('')}</div><div class="card" style="margin-top:13px"><h3>MISSION ${lv+1}: ${['The Border Watch','Hold the Crossing','Break Their Line','A Crown Divided','The Last Bastion'][lv%5]}</h3><p>Objective: ${['Destroy enemy Crystal','Protect your Crystal','Defeat all enemies','Survive the timer','Destroy enemy Tower'][lv%5]} · Enemy force: ${3+Math.floor(lv/2)} units · Recommended: Army level ${Math.max(1,Math.ceil((lv+1)/4))}</p><div class="row"><span class="badge">REWARD ${130+lv*22} GOLD</span><span class="badge">${90+lv*15} EXP</span></div><button class="primary" style="margin-top:12px" onclick="startBattle('campaign',${lv})">⚔ DEPLOY</button></div>`}function mode(a,b,m){return header(a,b)+`<div class="card" style="max-width:600px"><div class="unit">${m==='survival'?'♾️':'🏆'}</div><h2>${m==='survival'?'RECORD WAVE '+S.highestWave:'LOCAL GRAND TOURNAMENT'}</h2><p>Build your formation, command the field, earn rewards and improve your record. No network connection required.</p><div class="row"><span class="badge">Best score ${S.bestScore}</span><span class="badge">Tokens ${S.tokens}</span></div><button class="primary" style="margin-top:14px" onclick="startBattle('${m}',0)">START ${a}</button></div>`}function tournament(){return mode('TOURNAMENT','A local bracket to prove your army. Win three matches to claim the crown.','tournament')+`<div class="card" style="margin-top:12px"><h3>BRACKET</h3><p>Quarter-final　↓　Semi-final　↓　Final</p><div class="row"><span class="badge">Trophy wins ${S.trophy||0}</span><span class="badge">Best score ${S.bestScore}</span></div></div>`}function challenge(){let ch=['Only Warriors','No Archer','Double Enemy','Low Gold','Strong Enemy','Boss Rush','Speed Battle'];return header('CHALLENGES','Rotating local trials · refreshes daily')+`<div class="grid">${ch.map((n,i)=>`<div class="card"><h3>${['⚔','🚫','⚠','◈','☠','👹','⌛'][i]} ${n}</h3><p>${['Warrior-only army','Fight without archers','Twice the opposition','Begin with limited gold','Elite enemies','Bosses attack in sequence','Win before the clock runs out'][i]}</p><span class="badge">REWARD ${180+i*35} GOLD</span><br><button class="primary" style="margin-top:12px" onclick="startBattle('challenge',${i})">TAKE CHALLENGE</button></div>`).join('')}</div>`}
function shop(){return header('KINGDOM SHOP','Spend only the currency you earn in-game.')+`<div class="grid"><div class="card"><h3>✦ FREE REWARD</h3><p>Claim a daily bundle of gold and a chance at gems. Resets every 24 hours.</p><button class="primary" onclick="claimDaily()">CLAIM</button></div><div class="card"><h3>🎁 BASIC CHEST · 180 G</h3><p>Transparent odds: 60% gold, 22% equipment, 12% material, 6% skin.</p><button onclick="chest(180,'Basic')">OPEN CHEST</button></div><div class="card"><h3>💠 RARE CHEST · 5 GEMS</h3><p>50% equipment · 30% gold · 15% material · 5% skin.</p><button onclick="chest(5,'Rare',true)">OPEN CHEST</button></div><div class="card"><h3>🌟 EPIC CHEST · 12 GEMS</h3><p>Epic rewards: 45% equipment · 30% gold · 15% gems · 10% skin.</p><button onclick="chest(12,'Epic',true)">OPEN CHEST</button></div><div class="card"><h3>👑 LEGENDARY CHEST · 25 GEMS</h3><p>Premium in-game currency only. 50% equipment, 25% gold, 25% skin.</p><button onclick="chest(25,'Legendary',true)">OPEN CHEST</button></div><div class="card"><h3>⚑ DAILY EXCHANGE</h3><p>Battle tokens are earned from victories.</p><button onclick="buyTokens()">TRADE 5 TOKENS → 250 GOLD</button></div></div><h2 style="margin-top:24px">UNIT RECRUITMENT</h2><div class="grid">${names.map((n,i)=>`<div class="card"><h3>${icons[i]} ${n}</h3><p>${unitDesc(i)}</p><span class="badge">${costs[i]} GOLD</span> <button onclick="buyUnit(${i})">${S.owned.includes(i)?'UNLOCKED':'UNLOCK'}</button></div>`).join('')}</div><h2 style="margin-top:24px">EQUIPMENT</h2><div class="grid">${['Iron Sword','Steel Sword','Royal Sword','Heavy Shield','Reinforced Armor','Magic Staff','Ranger Bow'].map((n,i)=>`<div class="card"><h3>⚒ ${n}</h3><p>${['+5 Damage','+9 Damage','+16 Damage','+22 Armor','+30 HP · +8 Armor','+12 Magic Damage','+8 Damage · +5% Critical'][i]}</p><span class="badge">${[120,250,500,210,280,320,270][i]} G</span><button onclick="buyGear('${n}',${[120,250,500,210,280,320,270][i]})">BUY</button></div>`).join('')}</div>`}
function unitDesc(i){return ['Balanced melee fighter','Sturdy frontline defender','Long-range damage dealer','Area magic damage','Fast, fragile striker','Heavily armored tank','Massive area attacker','Legendary powerhouse'][i]}function buyUnit(i){if(S.owned.includes(i))return toast('Unit already unlocked');if(S.gold<costs[i])return toast('Not enough gold');S.gold-=costs[i];S.owned.push(i);save();toast(names[i]+' unlocked!');render()}function buyGear(n,c){if(S.gold<c)return toast('Not enough gold');S.gold-=c;S.equip.push({name:n,rarity:'Common',unit:0});save();toast(n+' added to inventory');render()}function chest(c,n,g){if(g?S.gems<c:S.gold<c)return toast('Not enough currency');if(g)S.gems-=c;else S.gold-=c;let r=Math.random(),msg;if(r<.55){let amt=180+Math.floor(Math.random()*320);S.gold+=amt;msg=amt+' gold'}else if(r<.8){S.equip.push({name:['Royal Sword','Heavy Shield','Magic Staff','Ranger Bow'][Math.random()*4|0],rarity:n,unit:0});msg=n+' equipment'}else if(r<.94){S.gems+=3;msg='3 bonus gems'}else{let skin=['Royal','Shadow','Fire','Ice','Golden','Ancient'][Math.random()*6|0];if(!S.skins.includes(skin))S.skins.push(skin);msg=skin+' skin'}save();toast(n+' Chest: '+msg);render()}function buyTokens(){if(S.tokens<5)return toast('Win battles to earn tokens');S.tokens-=5;S.gold+=250;save();render()}function claimDaily(){let now=Date.now();if(now-S.daily<86400000)return toast('Daily reward available in '+Math.ceil((86400000-(now-S.daily))/3600000)+'h');let day=(S.day%7)+1;S.day=day;S.daily=now;let msg;if(day===2){S.gems+=4;msg='4 gems'}else if(day===3){S.gold+=200;msg='200 gold · upgrade material'}else if(day===5){S.equip.push({name:'Iron Sword',rarity:'Uncommon',unit:0});msg='Uncommon Iron Sword'}else if(day===6){S.gold+=350;msg='Chest bundle · 350 gold'}else if(day===7){S.gems+=10;S.gold+=500;msg='Rare reward · 10 gems and 500 gold'}else{S.gold+=day===1?150:300;msg=(day===1?150:300)+' gold'}save();toast('Day '+day+' reward: '+msg);render()}
function army(){return header('YOUR ARMY','Train units, equip gear and prepare your formation.')+`<div class="grid">${names.map((n,i)=>{let unlocked=S.owned.includes(i),lv=S.units[i]||1,xp=S.unitXp[i]||0;return `<div class="card" style="opacity:${unlocked?1:.52}"><div class="unit">${unlocked?icons[i]:'?'}</div><h3>${n} <span class="badge">LV ${lv}</span></h3><p>${unlocked?unitDesc(i):'Locked · recruit from the shop.'}</p><div class="stat">HP ${stats[i][0]+(lv-1)*12} · DMG ${stats[i][1]+(lv-1)*3} · ARM ${i===5?25:5+lv*2}<br>SPD ${stats[i][2]} · RANGE ${stats[i][3]} · COST ${costs[i]}</div><div style="margin:10px 0" class="bar"><i style="width:${xp%100}%"></i></div><div class="fine">Unit EXP ${xp%100}/100</div><button ${!unlocked?'disabled':''} onclick="upgradeUnit(${i})">UPGRADE · ${100*lv} G</button> <button onclick="selectUnit(${i})">SELECT</button><button onclick="toast('${n}: ${unitDesc(i)}')">PREVIEW</button></div>`}).join('')}</div><div class="card" style="margin-top:12px"><h3>INVENTORY · EQUIPMENT</h3>${S.equip.length?S.equip.map((e,i)=>`<div class="row spread" style="padding:7px;border-bottom:1px solid var(--line)"><span>⚒ ${e.name} · ${e.rarity}</span><button onclick="equipItem(${i})">EQUIP</button><button onclick="sellItem(${i})">SELL 60 G</button></div>`).join(''):'<p>No equipment yet. Find gear in Shop chests or buy it directly.</p>'}</div>`}function upgradeUnit(i){let c=100*S.units[i];if(!S.owned.includes(i))return toast('Unlock this unit first');if(S.gold<c)return toast('Not enough gold');S.gold-=c;S.units[i]++;S.unitXp[i]=0;S.quests.upgrade=(S.quests.upgrade||0)+1;save();toast(names[i]+' upgraded to level '+S.units[i]);render()}function selectUnit(i){S.selected=i;save();toast(names[i]+' selected for deployment')}function equipItem(i){S.equip[i].unit=S.selected||0;save();toast(S.equip[i].name+' equipped to '+names[S.equip[i].unit]);render()}function sellItem(i){S.equip.splice(i,1);S.gold+=60;save();render()}
const upg=['Army Damage','Army HP','Army Armor','Army Speed','Attack Speed','Mining Speed','Gold Capacity','Worker Speed','Crystal HP','Tower Damage','Tower Range','Building HP','Maximum Population','Formation Strength','Deployment Speed'];function upgrades(){return header('UPGRADE TREE','Permanent realm-wide improvements. Prices increase at every tier.')+`<div class="grid">${upg.map((n,i)=>{let lv=S.upgrades[i]||0,c=100+lv*110+(i>4?50:0);return `<div class="card"><h3>${['⚔','♥','🛡','➤','⚡','⛏','◈','♟','💎','🏹','◎','▰','♙','⚑','⌛'][i]} ${n}</h3><p>Tier ${lv} · ${['+5% damage','+8% health','+3 armor','+4% speed','+4% attack rate','+10% mining','+200 storage','+8% worker speed','+10% crystal health','+8% tower damage','+5% range','+10% building health','+5 population','+5% formation power','+6% deploy speed'][i]} per tier</p><button onclick="upgradeTech(${i},${c})">UPGRADE · ${c} G</button></div>`}).join('')}</div>`}function upgradeTech(i,c){if(S.gold<c)return toast('Not enough gold');S.gold-=c;S.upgrades[i]=(S.upgrades[i]||0)+1;save();toast('Upgrade researched');render()}
function quests(){let q=[['Win battles',S.quests.wins||0,3,180],['Defeat enemies',S.quests.kills||0,30,220],['Collect gold',S.quests.gold||0,800,240],['Upgrade a unit',S.quests.upgrade||0,1,150],['Open chests',S.quests.chests||0,2,200]];return header('QUESTS','Local daily objectives. Progress is saved on this device.')+`<div class="grid">${q.map(([n,v,t,r],i)=>`<div class="card"><h3>☷ ${n}</h3><p>Progress ${Math.min(v,t)} / ${t}</p><div class="bar"><i style="width:${Math.min(100,v/t*100)}%"></i></div><p>Reward ${r} gold</p><button ${v<t||S.quests.claimed.includes(i)?'disabled':''} onclick="claimQuest(${i},${r})">${S.quests.claimed.includes(i)?'CLAIMED':'CLAIM REWARD'}</button></div>`).join('')}</div>`}function claimQuest(i,r){if(S.quests.claimed.includes(i))return;S.quests.claimed.push(i);S.gold+=r;save();toast('Quest completed!');render()}
function collection(){let all=['Royal','Shadow','Fire','Ice','Golden','Ancient'];return header('COLLECTION','Discover realms, heroes, equipment and cosmetic skins.')+`<h2>SKINS</h2><div class="grid">${all.map((n,i)=>`<div class="card"><div class="unit" style="filter:${S.skins.includes(n)?'none':'brightness(0)' }">${['👑','🌑','🔥','❄️','✨','🗿'][i]}</div><h3>${S.skins.includes(n)?n:'???'}</h3><p>${S.skins.includes(n)?'Unlocked cosmetic appearance':'Silhouette · unlock from rewards and chests'}</p></div>`).join('')}</div><h2 style="margin-top:20px">REALMS · ${regions.length}</h2><div class="grid">${regions.map((n,i)=>`<div class="card"><h3>${i<=Math.floor(S.campaign/4)?'🗺️':'🔒'} ${i<=Math.floor(S.campaign/4)?n:'Undiscovered Realm'}</h3><p>${i<=Math.floor(S.campaign/4)?'Campaign progress: '+Math.min(4,Math.max(0,S.campaign-i*4))+'/4 missions':'Complete previous realm to reveal'}</p></div>`).join('')}</div><h2 style="margin-top:20px">BOSSES</h2><p class="muted">Stone Golem · Fire Beast · Ice Giant · Shadow Lord · Ancient Titan</p>`}const achs=[['First Victory',S.wins>=1,'Win your first battle'],['100 Enemies',S.kills>=100,'Defeat 100 enemies'],['1000 Enemies',S.kills>=1000,'Defeat 1,000 enemies'],['Gold Collector',S.totalGold>=5000,'Collect 5,000 total gold'],['Boss Slayer',S.highestWave>=5,'Defeat a wave boss'],['Survival Master',S.highestWave>=20,'Reach survival wave 20'],['Tournament Champion',(S.trophy||0)>=1,'Win the tournament'],['Upgrade Master',Object.values(S.upgrades).reduce((a,b)=>a+b,0)>=10,'Research 10 upgrades']];function achievements(){return header('ACHIEVEMENTS','Milestones earn one-time gold rewards.')+`<div class="grid">${achs.map(([n,ok,d],i)=>`<div class="card"><h3>${ok?'🏅':'🔒'} ${n}</h3><p>${d}</p><span class="badge">${ok?'COMPLETED':'REWARD '+(150+i*45)+' G'}</span>${ok&&!S.achievements.includes(i)?`<button onclick="claimAch(${i},${150+i*45})">CLAIM</button>`:''}</div>`).join('')}</div>`}function claimAch(i,r){S.achievements.push(i);S.gold+=r;save();toast('Achievement reward claimed');render()}function profile(){return header('COMMANDER PROFILE','A record of your reign.')+`<div class="card" style="max-width:600px"><div class="row spread"><h2>♙ ${S.name}</h2><button onclick="rename()">EDIT NAME</button></div><h3>LEVEL ${S.level}</h3><div class="bar"><i style="width:${S.xp/(S.level*100)*100}%"></i></div><p>${S.xp} / ${S.level*100} EXP</p><div class="grid">${[['Battles',S.battles],['Victories',S.wins],['Defeats',S.losses],['Enemies defeated',S.kills],['Highest survival wave',S.highestWave],['Tournament wins',S.trophy||0],['Gold collected',S.totalGold],['Best score',S.bestScore]].map(([a,b])=>`<div class="card"><div class="muted">${a}</div><h2>${b}</h2></div>`).join('')}</div></div>`}function rename(){let n=prompt('Commander name',S.name);if(n){S.name=n.slice(0,20);save();render()}}
function settings(){return header('SETTINGS','Preferences and save data are stored on this device.')+`<div class="grid">${[['Music','music'],['Sound effects','sfx'],['Vibration','vibration'],['Damage numbers','damage']].map(([n,k])=>`<div class="card"><h3>${n}</h3><button onclick="toggle('${k}')">${S.settings[k]?'ON':'OFF'}</button></div>`).join('')}<div class="card"><h3>Graphics</h3><select onchange="S.settings.graphics=this.value;save()"><option>LOW</option><option selected>MEDIUM</option><option>HIGH</option></select></div><div class="card"><h3>Language</h3><select onchange="S.settings.language=this.value;save()"><option ${S.settings.language==='English'?'selected':''}>English</option><option ${S.settings.language==='Indonesia'?'selected':''}>Indonesia</option></select></div><div class="card"><h3>Save</h3><p>Progress autosaves to localStorage.</p><button onclick="save();toast('Game saved')">SAVE NOW</button> <button class="danger" onclick="resetSave()">RESET SAVE</button></div></div>`}function toggle(k){S.settings[k]=!S.settings[k];save();render()}function resetSave(){if(confirm('Reset all progress permanently?')){localStorage.removeItem('skSave');S=fresh();save();show('home')}}
function startBattle(mode,level){battle={mode,level,time:0,gold:mode==='challenge'&&level===3?150:350+level*12,kills:0,lost:0,selected:[],units:[],enemy:[],projectiles:[],particles:[],camera:0,paused:false,done:false,formation:'Line',wave:mode==='survival'?1:level+1};for(let i=0;i<3;i++)battle.units.push(makeUnit(false,i));for(let i=0;i<2+Math.floor(level/3)+(mode==='survival'?battle.wave:0);i++)battle.enemy.push(makeUnit(true,i));show('battle');requestAnimationFrame(loop)}function makeUnit(enemy,i){let t=enemy?Math.random()*Math.min(6,Math.max(1,S.owned.length-1))|0:(S.selected||0);return{x:enemy?920+i*22:150+i*35,y:270+(i%3)*23,hp:(stats[t][0]+(S.units[t]-1)*12)*(enemy?1+((battle?.level||0)*.035):1),max:(stats[t][0]+(S.units[t]-1)*12)*(enemy?1+((battle?.level||0)*.035):1),dmg:stats[t][1]*(enemy?1.1:1),speed:stats[t][2]*35,range:stats[t][3]*32,enemy,type:t,attack:0,alive:true,hit:0}}function battleView(){return header('BATTLEFIELD','Select units · deploy reinforcements · drag to command')+`<div class="canvasbox"><canvas id="field"></canvas></div><div class="battleui"><button onclick="deploy(0)">⚔ Warrior ${costs[0]}G</button><button onclick="deploy(1)">🛡 Spear ${costs[1]}G</button><button onclick="deploy(2)">🏹 Archer ${costs[2]}G</button><button onclick="deploy(3)">🔮 Mage ${costs[3]}G</button><button onclick="deploy(4)">🗡 Assassin ${costs[4]}G</button><button onclick="deploy(5)">♞ Knight ${costs[5]}G</button><button onclick="hireWorker()">♟ Worker 70G</button><button onclick="battle.formation=['Line','Defensive','Offensive','Circle','Follow'][( ['Line','Defensive','Offensive','Circle','Follow'].indexOf(battle.formation)+1)%5];toast('Formation: '+battle.formation)">FORMATION</button><button onclick="pause()">Ⅱ PAUSE</button></div><div class="row spread" style="margin-top:8px"><span id="battleStats" class="badge"></span><span class="badge" id="battleGold"></span><button onclick="pause()">Ⅱ</button></div>`}function deploy(i){if(!battle||battle.done)return;if(!S.owned.includes(i))return toast('Unlock unit in Shop');if(battle.gold<costs[i])return toast('Not enough battle gold');if(battle.units.filter(u=>u.alive).length>=24)return toast('MAX POPULATION');battle.gold-=costs[i];let u=makeUnit(false,battle.units.length);u.type=i;u.x=140;u.hp=u.max=stats[i][0]+(S.units[i]-1)*12;u.dmg=stats[i][1]+(S.units[i]-1)*3;battle.units.push(u)}function hireWorker(){if(battle.gold<70)return toast('Not enough battle gold');if(battle.workers>=4)return toast('Worker limit reached');battle.gold-=70;battle.workers=(battle.workers||1)+1;toast('Worker hired · mining rate increased')}function pause(){if(!battle)return;battle.paused=!battle.paused;if(battle.paused)modal(`<h2>BATTLE PAUSED</h2><p>Your army awaits your command.</p><div class="row"><button class="primary" onclick="closeModal();battle.paused=false">RESUME</button><button onclick="closeModal();startBattle(battle.mode,battle.level)">RESTART</button><button onclick="closeModal();show('settings')">SETTINGS</button><button onclick="closeModal();battle=null;show('home')">EXIT BATTLE</button></div>`)}function modal(html){$('#modal').innerHTML=`<div class="overlay"><div class="modal">${html}</div></div>`}function closeModal(){$('#modal').innerHTML=''}
function loop(t){if(!battle||page!=='battle')return;let cv=$('#field');if(!cv)return;let dpr=Math.min(devicePixelRatio||1,1.5),w=cv.clientWidth,h=cv.clientHeight;if(cv.width!==w*dpr||cv.height!==h*dpr){cv.width=w*dpr;cv.height=h*dpr}let x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);if(!battle.paused&&!battle.done){battle.time+=1/60;if(battle.time%4<.02)battle.gold=Math.min(1200,battle.gold+(battle.workers||1)*2);updateBattle()}draw(x,w,h);$('#battleStats').textContent=`${battle.mode.toUpperCase()} · ${Math.floor(battle.time)}s · ☠ ${battle.kills}`;$('#battleGold').textContent=`◆ ${Math.floor(battle.gold)} · Crystal ${Math.max(0,Math.floor(battle.crystal||100))}%`;raf=requestAnimationFrame(loop)}function updateBattle(){let b=battle;for(let u of [...b.units,...b.enemy]){if(!u.alive)continue;u.attack-=1/60;let foes=u.enemy?b.units:b.enemy,target=foes.filter(v=>v.alive).sort((a,c)=>Math.abs(a.x-u.x)-Math.abs(c.x-u.x))[0];if(!target){if(u.enemy){if(Math.abs(u.x-75)<120){b.crystal=(b.crystal||100)-.04;if(b.crystal<=0)finish(false)}else u.x-=u.speed/60}else if(Math.abs(u.x-980)<60){b.enemyCrystal=(b.enemyCrystal||100)-.05;if(b.enemyCrystal<=0)finish(true)}else u.x+=u.speed/60;continue}let dist=Math.abs(target.x-u.x);if(dist>u.range+20)u.x+=(u.enemy?-1:1)*u.speed/60;else if(u.attack<=0){u.attack=stats[u.type][2];target.hp-=u.dmg;if(target.hp<=0){target.alive=false;if(!u.enemy){b.kills++;b.gold+=6}}}}if(b.time>1&&Math.floor(b.time)%8===0&&Math.abs(b.time-Math.floor(b.time))<.018)b.gold+=4;if(!b.enemy.some(u=>u.alive))finish(true);if(b.time>135)finish((b.enemy.filter(u=>u.alive).length)<(b.units.filter(u=>u.alive).length))}function draw(x,w,h){let b=battle;x.clearRect(0,0,w,h);let grd=x.createLinearGradient(0,0,0,h);grd.addColorStop(0,'#95b8a0');grd.addColorStop(.68,'#627b52');grd.addColorStop(.69,'#3d5036');grd.addColorStop(1,'#283929');x.fillStyle=grd;x.fillRect(0,0,w,h);x.fillStyle='#314831';for(let i=0;i<12;i++){let xx=(i*117-b.time*4)%(w+80);x.beginPath();x.arc(xx,h*.62,20+i%3*8,Math.PI,0);x.fill()}x.fillStyle='#756247';x.fillRect(0,h*.73,w,h*.04);const scale=w/1000;x.save();x.scale(scale,scale);x.fillStyle='#7ac28e';x.fillRect(35,205,70,105);x.fillStyle='#ef765f';x.fillRect(895,205,70,105);x.fillStyle='#d9c373';x.fillRect(62,170,15,38);x.fillStyle='#e0ab66';x.fillRect(922,170,15,38);for(let u of [...b.units,...b.enemy])if(u.alive){x.strokeStyle=u.enemy?'#f07868':'#e4eee0';x.lineWidth=u.type>=6?9:5;x.lineCap='round';x.beginPath();x.arc(u.x,u.y-28,u.type>=6?12:8,0,7);x.moveTo(u.x,u.y-20);x.lineTo(u.x,u.y+7);x.moveTo(u.x-10,u.y-10);x.lineTo(u.x+10,u.y-8);x.moveTo(u.x,u.y+7);x.lineTo(u.x-8,u.y+20);x.moveTo(u.x,u.y+7);x.lineTo(u.x+8,u.y+20);x.stroke();x.fillStyle='#201d16';x.fillRect(u.x-13,u.y-44,26,4);x.fillStyle=u.enemy?'#ec685a':'#75df95';x.fillRect(u.x-13,u.y-44,26*Math.max(0,u.hp/u.max),4)}x.restore();x.fillStyle='#fff';x.font='bold 12px system-ui';x.fillText(b.paused?'PAUSED':'YOUR KEEP',15,20);x.fillText(b.mode==='survival'?'WAVE '+b.wave:'MISSION '+(b.level+1),w-100,20)}
function finish(win){if(!battle||battle.done)return;battle.done=true;cancelAnimationFrame(raf);let b=battle,k=b.kills,winGold=win?(160+(b.level||0)*25+k*4):50,exp=win?100+(b.level||0)*12:30;S.battles++;if(win){S.wins++;S.quests.wins=(S.quests.wins||0)+1;S.tokens+=b.mode==='tournament'?3:1;if(b.mode==='campaign'){S.stars[b.level]=Math.max(S.stars[b.level]||0,b.time<50?3:b.time<90?2:1);S.campaign=Math.max(S.campaign,b.level+1)}if(b.mode==='survival')S.highestWave=Math.max(S.highestWave,b.wave);if(b.mode==='tournament'){S.trophy=(S.trophy||0)+1;if(S.trophy%3===0)S.gems+=5}}else S.losses++;S.kills+=k;S.quests.kills=(S.quests.kills||0)+k;S.gold+=winGold;S.totalGold+=winGold;S.quests.gold=(S.quests.gold||0)+winGold;S.xp+=exp;if(S.xp>=S.level*100){S.xp-=S.level*100;S.level++;S.gold+=100+S.level*20;if(S.level%5===0)S.gems++;toast('Level up! Level '+S.level)}for(let u of b.units)if(!u.enemy&&u.alive){S.unitXp[u.type]+=20;if(S.unitXp[u.type]>=100){S.units[u.type]++;S.unitXp[u.type]-=100}}S.bestScore=Math.max(S.bestScore,k*100+Math.floor(b.time*5));if(b.mode==='survival'&&win&&b.wave<3){b.wave++;S.gold+=40;save();modal(`<h2>WAVE ${b.wave-1} CLEARED</h2><p>Prepare for wave ${b.wave}. Your surviving army continues.</p><button class="primary" onclick="closeModal();battle.done=false;b.enemy=[];for(let i=0;i<3+b.wave;i++)battle.enemy.push(makeUnit(true,i));requestAnimationFrame(loop)">NEXT WAVE</button> <button onclick="closeModal();show('survival')">CLAIM & EXIT</button>`);return}save();let title=win?'VICTORY!':'DEFEAT';modal(`<h2>${title}</h2><p>${win?'A realm remembers its defenders.':'Regroup, reinforce and return stronger.'}</p><div class="grid"><div class="card">Rating<br><strong>${win?'★'.repeat(b.time<50?3:b.time<90?2:1):'—'}</strong></div><div class="card">Time<br><strong>${Math.floor(b.time)} sec</strong></div><div class="card">Enemies defeated<br><strong>${k}</strong></div><div class="card">Reward<br><strong>+${winGold} Gold · +${exp} EXP</strong></div></div><div class="row" style="margin-top:12px"><button class="primary" onclick="closeModal();battle=null;show('${win?(b.mode==='campaign'?'campaign':b.mode):'campaign'}')">${win?'NEXT':'CHANGE ARMY'}</button><button onclick="closeModal();startBattle('${b.mode}',${b.level})">REPLAY / RETRY</button><button onclick="closeModal();battle=null;show('home')">MAIN MENU</button></div>`)}
function claimQuest(){ }function boot(){nav();render();resources()}boot();
// Canvas pointer supports click/drag selection and ground orders.
document.addEventListener('pointerdown',e=>{if(!battle||page!=='battle'||!e.target.matches('canvas'))return;let r=e.target.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*1000;let u=battle.units.find(u=>u.alive&&Math.abs(u.x-px)<35);if(u){battle.selected=[u]}else if(battle.selected.length){battle.selected.forEach(v=>v.x=Math.max(120,Math.min(850,px)))} });
window.startBattle=startBattle;window.deploy=deploy;window.hireWorker=hireWorker;window.pause=pause;window.chest=chest;window.buyUnit=buyUnit;window.buyGear=buyGear;window.buyTokens=buyTokens;window.upgradeUnit=upgradeUnit;window.selectUnit=selectUnit;window.equipItem=equipItem;window.sellItem=sellItem;window.upgradeTech=upgradeTech;window.claimDaily=claimDaily;window.claimQuest=claimQuest;window.claimAch=claimAch;window.toggle=toggle;window.resetSave=resetSave;window.rename=rename;window.save=save;
})();
</script></body></html>
